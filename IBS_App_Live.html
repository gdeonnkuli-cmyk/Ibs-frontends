/** Zone de prise de photo d'une pièce d'identité. */
function champPiece(id) {
  return `
    <div class="pick" id="pick-${id}">
      <input type="file" id="${id}" accept="image/*" capture="environment" onchange="apercuPiece('${id}')">
      <div id="pickbody-${id}">
        <span class="ic">📷</span>
        <div class="tt">Prendre une photo</div>
        <div class="sb">ou choisir une image de la galerie</div>
      </div>
    </div>`;
}

/** Affiche la photo choisie : on ne transmet pas sa pièce d'identité à l'aveugle. */
function apercuPiece(id) {
  const input = document.getElementById(id);
  const zone = document.getElementById(`pick-${id}`);
  const corps = document.getElementById(`pickbody-${id}`);
  const f = input && input.files && input.files[0];
  if (!f) return;
  // L'URL n'est pas révoquée au chargement : le navigateur la libérerait avant
  // d'avoir fini de peindre l'image, et l'aperçu resterait vide. La précédente
  // est libérée au remplacement, ce qui suffit sur un formulaire.
  if (zone.dataset.url) URL.revokeObjectURL(zone.dataset.url);
  const url = URL.createObjectURL(f);
  zone.dataset.url = url;
  zone.classList.add("done");
  corps.innerHTML = `
    <div class="pick-preview">
      <img src="${url}" alt="Aperçu de la pièce">
      <div>
        <div class="nm">${esc(f.name)}</div>
        <div class="ch">✓ Photo ajoutée — appuyez pour la remplacer</div>
      </div>
    </div>`;
}

/** Visuel de tête d'une carte d'offre : la photo, ou un substitut sobre. */

    ${photos.length > 1 ? `<span class="cover-count">📷 ${photos.length}</span>` : ""}
  </div>`;
}

function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ""; }

function eqLabel(code) { const e = EQUIPEMENTS_LIST.find(x => x.code === code); return e ? `${e.ic} ${e.label}` : code; }

/* ── Jeu d'icônes ────────────────────────────────────────────────────────
   Les emojis servaient d'icônes dans la navigation et les cartes. Ils
   viennent de familles graphiques différentes et, surtout, chaque fabricant
   dessine les siens : un Samsung, un Tecno et un iPhone n'affichaient pas
   la même chose. Ces tracés sont les mêmes partout, prennent la couleur du
   texte qui les porte, et se règlent par la taille de police. */
const ICONES = {
  accueil:     'M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
  recherche:   'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14ZM20 20l-4.2-4.2',
  dossier:     'M4 5h5l2 2.5h9V19H4z',
  document:    'M6 3h8l4 4v14H6zM14 3v4h4',
  contrat:     'M6 3h12v18H6zM9 8h6M9 12h6M9 16h3',
  profil:      'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4 21c0-3.9 3.6-6 8-6s8 2.1 8 6',
  cloche:      'M18 16V11a6 6 0 1 0-12 0v5l-2 2h16zM10 21h4',
  cle:         'M14.5 4a5.5 5.5 0 1 0-4.6 8.5L4 18.4V21h3l1.5-1.5V18h1.8l1.3-1.3v-1.8h1.6a5.5 5.5 0 0 0 1.3-10.9Z',
  maison:      'M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z',
  carte:       'M3 6h18v12H3zM7 10h4M7 14h7M15 9h3v3h-3z',
  billet:      'M3 7h18v10H3zM12 9.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z',
  drapeau:     'M6 21V4h12l-2.5 4L18 12H6',
  balance:     'M12 4v16M6 8h12M6 8 3 15h6zM18 8l-3 7h6zM8 21h8',
  horloge:     'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM12 7v5l3.5 2',
  graphique:   'M4 20V10M10 20V4M16 20v-7M22 20H2',
  coeur:       'M12 20s-7-4.4-7-9.2A3.8 3.8 0 0 1 12 8a3.8 3.8 0 0 1 7 2.8C19 15.6 12 20 12 20Z',
  etoile:      'M12 4l2.4 5 5.6.7-4 3.8 1 5.5-5-2.7-5 2.7 1-5.5-4-3.8 5.6-.7z',
  message:     'M4 5h16v11H9l-5 4z',
  alerte:      'M12 4v9M12 17v.5M12 3l9 17H3z',
  poignee:     'M3 12h4l3 3 2-2 3 3 2-2 4 1M7 9h4l2 2',
  calendrier:  'M4 6h16v15H4zM4 10h16M8 3v4M16 3v4',
};

/**
 * @param {string} nom  clé de ICONES
 * @param {number} px   taille du carré
 */
function icone(nom, px = 20) {
  const d = ICONES[nom];
  if (!d) return "";
  return `<svg class="ic-svg" width="${px}" height="${px}" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true">${d.split("M").filter(Boolean).map(seg => `<path d="M${seg.trim()}"/>`).join("")}</svg>`;
}

/**
 * Échappe une valeur avant insertion dans du HTML.
 *
 * Les titres d'annonces, descriptions, messages et motifs de contestation sont
 * saisis par les utilisateurs et rendus par interpolation de chaînes : sans
 * échappement, un bailleur pouvait titrer son annonce avec une balise et
 * exécuter du code chez tous les locataires qui la consultent — le jeton de
 * session est dans localStorage.
 */
function esc(v) {
  if (v === null || v === undefined) return "";
  return String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ""; }
/* Les colonnes DATE remontent de PostgreSQL en ISO complet : sans ça, une fin
   de bail s'affiche « 2026-11-12T00:00:00.000Z » à l'écran d'un locataire. */
function dateFr(v) {
  if (!v) return "—";
  const d = new Date(v);
  return isNaN(d) ? String(v) : d.toLocaleDateString("fr-FR", { day: "2-digit", month: "long", year: "numeric" });
}
function setBusy(id, busy) {
  const el = document.getElementById(id);
  if (!el) return;
  if (busy) {
    if (!el.dataset.label) el.dataset.label = el.innerHTML;
    el.disabled = true;
    el.innerHTML = '<span class="spin"></span>';
  } else {
    el.disabled = false;
    if (el.dataset.label) el.innerHTML = el.dataset.label;
  }
}
function wire() {}

// PWA : n'enregistre le service worker que si l'app est réellement hébergée (http/https).
// Depuis un fichier local (content://, file://), ceci ne fait rien — comportement normal, pas une erreur.
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./IBS_sw.js").catch(() => {});
  });
}

boot();
